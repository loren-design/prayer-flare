<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a0a0f">
    <title>Your Prayer Wall - Prayer Flare</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #0a0a0f;
            --bg-card: #141419;
            --text-primary: #ffffff;
            --text-secondary: #e8d5c4;
            --text-muted: #c4a882;
            --flare-orange: #ff6b35;
            --flare-glow: rgba(255, 107, 53, 0.4);
            --gold: #ffd700;
            --border-subtle: rgba(255, 255, 255, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            padding: 30px 0;
        }

        .header-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .header-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 32px;
            letter-spacing: 3px;
            color: var(--flare-orange);
            margin-bottom: 8px;
        }

        .header-subtitle {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .prayer-id {
            display: inline-block;
            background: rgba(255, 107, 53, 0.15);
            border: 1px solid rgba(255, 107, 53, 0.3);
            padding: 8px 16px;
            border-radius: 20px;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 14px;
            letter-spacing: 2px;
            color: var(--flare-orange);
            margin-top: 12px;
        }

        .bookmark-tip {
            background: rgba(251, 191, 36, 0.1);
            border: 1px solid rgba(251, 191, 36, 0.3);
            border-radius: 12px;
            padding: 14px;
            margin: 20px 0;
            text-align: center;
        }

        .bookmark-text {
            font-size: 13px;
            color: #fbbf24;
        }

        .prayers-section {
            margin-top: 24px;
        }

        .section-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 18px;
            letter-spacing: 2px;
            color: var(--text-muted);
            margin-bottom: 16px;
        }

        .prayer-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
        }

        .prayer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .prayer-author {
            font-weight: 600;
            color: var(--flare-orange);
            font-size: 14px;
        }

        .prayer-time {
            font-size: 12px;
            color: var(--text-muted);
        }

        .prayer-text {
            font-size: 15px;
            line-height: 1.7;
            color: var(--text-secondary);
            margin-bottom: 12px;
        }

        .prayer-scripture {
            font-size: 13px;
            color: var(--gold);
            font-style: italic;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
        }

        .empty-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .home-link {
            text-align: center;
            margin-top: 30px;
        }

        .home-link a {
            color: var(--flare-orange);
            text-decoration: none;
            font-size: 14px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
        }

        .error {
            text-align: center;
            padding: 40px;
            color: #ff6b6b;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-icon">🙏</div>
            <h1 class="header-title">Your Prayer Wall</h1>
            <p class="header-subtitle">Warriors are lifting you up</p>
            <div class="prayer-id" id="prayerId">Loading...</div>
        </div>

        <div class="bookmark-tip">
            <p class="bookmark-text">📌 Bookmark this page to return and see new prayers from warriors lifting you up!</p>
        </div>

        <div class="prayers-section">
            <h2 class="section-title">PRAYERS FOR YOU</h2>
            <div id="prayersList">
                <div class="loading">Loading prayers...</div>
            </div>
        </div>

        <div class="home-link">
            <a href="index.html">← Send Another Flare</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://shesaxxugzfdozlmigrk.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNoZXNheHh1Z3pmZG96bG1pZ3JrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQ4MzIxMTAsImV4cCI6MjA4MDQwODExMH0.CXQqq8EAQ50w7NxnVvKwOVf5LuRr-x8tnuDajQK_qds';

        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function loadWall() {
            const params = new URLSearchParams(window.location.search);
            const prayerId = params.get('id');
            const token = params.get('token');

            if (!prayerId || !token) {
                document.getElementById('prayersList').innerHTML = '<div class="error">Invalid wall link. Please use the link from your flare confirmation.</div>';
                return;
            }

            document.getElementById('prayerId').textContent = prayerId;

            try {
                // Verify token
                const { data: wall } = await db
                    .from('Prayer Walls')
                    .select('*')
                    .eq('prayer_id', prayerId)
                    .eq('access_token', token)
                    .single();

                if (!wall) {
                    document.getElementById('prayersList').innerHTML = '<div class="error">Wall not found or invalid token.</div>';
                    return;
                }

                // Load prayers
                const { data: prayers } = await db
                    .from('Prayers')
                    .select('*')
                    .eq('prayer_id', prayerId)
                    .order('created_at', { ascending: false });

                if (!prayers || prayers.length === 0) {
                    document.getElementById('prayersList').innerHTML = `
                        <div class="empty-state">
                            <div class="empty-icon">🕊️</div>
                            <p>Prayers are on the way. Check back soon.</p>
                        </div>
                    `;
                    return;
                }

                let html = '';
                prayers.forEach(prayer => {
                    const time = new Date(prayer.created_at).toLocaleString();
                    html += `
                        <div class="prayer-card">
                            <div class="prayer-header">
                                <span class="prayer-author">${prayer.watchman_name || 'A Prayer Warrior'}</span>
                                <span class="prayer-time">${time}</span>
                            </div>
                            <p class="prayer-text">${prayer.prayer_text}</p>
                            ${prayer.scripture_reference ? `<p class="prayer-scripture">— ${prayer.scripture_reference}</p>` : ''}
                        </div>
                    `;
                });

                document.getElementById('prayersList').innerHTML = html;

            } catch (err) {
                console.error('Error:', err);
                document.getElementById('prayersList').innerHTML = '<div class="error">Error loading prayers. Please try again.</div>';
            }
        }

        loadWall();
    </script>
</body>
</html>
